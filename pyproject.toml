[project]
name = "engineering-advisor-api"
version = "0.1.0"
description = "EngineeringAdvisor API - 29-工程 行业顾问产品后端(FastAPI)"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
    { name = "EngineeringAdvisor Team", email = "architectzy@36advisors.local" }
]
keywords = ["fastapi", "engineering", "advisor", "29-engineering"]

# 主依赖(Python 包,不锁次版本,锁主版本)
dependencies = [
    "fastapi>=0.115.0,<1.0",        # 2026-08 当前稳定主版本
    "uvicorn[standard]>=0.30.0,<1.0",  # ASGI 服务器,standard 含 watchgod/websockets
    "pydantic>=2.8.0,<3.0",          # 数据校验
    "pydantic-settings>=2.4.0,<3.0", # 配置中心
    "python-dotenv>=1.0.1,<2.0",     # .env 加载
    "httpx>=0.27.0,<1.0",            # 异步 HTTP(后续外呼飞书/Neo4j 用)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=5.0.0,<6.0",
    "ruff>=0.6.0,<1.0",              # linter + formatter
    "mypy>=1.11.0,<2.0",
]

[project.scripts]
# 后续可加 `ea-api = "api.cli:main"` 等 CLI 入口,目前留空

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]
exclude = ["tests*", "docs*", ".plan*", ".Log*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line-too-long(已在 formatter 控制)

[tool.mypy]
python_version = "3.9"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
